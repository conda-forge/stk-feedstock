schema_version: 1

context:
  name: stk
  version: "2026.10.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stk-${{ version }}.tar.gz
  sha256: fd59de01ba0c497ed16e3db4b99343ba94500cefe0b1654052702f52e69545a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - atomlite
    - scipy
    - matplotlib-base
    - pandas
    - pathos
    - seaborn
    - numpy
    - pymongo
    - mchammer
    - spindry
    - vabene
    - rdkit !=2024.3.5

tests:
  - python:
      imports:
        - stk
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A Python library which allows construction and manipulation of complex molecules, as well as automatic molecular design and the creation of molecular databases.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/lukasturcani/stk

extra:
  recipe-maintainers:
    - jan-janssen
